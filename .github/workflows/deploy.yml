# GitHub Pages must use "GitHub Actions" as the source (Settings → Pages).
# If Pages is set to "Deploy from a branch", visitors get the raw source
# index.html instead of Vite's built dist/index.html and the app stays blank.

name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify dist output (not source)
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/favicon.svg
          test -f dist/sw.js
          test -f dist/.nojekyll
          grep -q '/NodeMind/assets/' dist/index.html
          grep -q './manifest.json' dist/index.html
          grep -q './favicon.svg' dist/index.html
          grep -q 'serviceWorker' dist/assets/*.js
          ! grep -q '%BASE_URL%' dist/index.html
          ! grep -q 'src/main.jsx' dist/index.html
          echo "dist/index.html:"
          cat dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
