<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="NodeMind">
  <defs>
    <linearGradient id="nm-bg" x1="96" y1="32" x2="416" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141826"/>
      <stop offset="55%" stop-color="#0c101c"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <radialGradient id="nm-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 220) rotate(90) scale(210 190)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nm-node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="nm-hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="40%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="nm-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#nm-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#nm-glow)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" stroke="#6366f1" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Mind-map mark (safe zone ~80%) -->
  <g filter="url(#nm-soft)">
    <!-- Connectors -->
    <path
      d="M256 168V248M256 248L176 336M256 248L336 336"
      stroke="#94a3b8"
      stroke-opacity="0.55"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M256 168V248M256 248L176 336M256 248L336 336"
      stroke="#c7d2fe"
      stroke-opacity="0.95"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Child nodes -->
    <circle cx="176" cy="336" r="42" fill="url(#nm-node)"/>
    <circle cx="176" cy="336" r="42" stroke="#eef2ff" stroke-opacity="0.55" stroke-width="5"/>
    <circle cx="336" cy="336" r="42" fill="url(#nm-node)"/>
    <circle cx="336" cy="336" r="42" stroke="#eef2ff" stroke-opacity="0.55" stroke-width="5"/>

    <!-- Hub -->
    <circle cx="256" cy="168" r="48" fill="url(#nm-hub)"/>
    <circle cx="256" cy="168" r="48" stroke="#ffffff" stroke-opacity="0.7" stroke-width="6"/>
    <circle cx="256" cy="168" r="16" fill="#0b1020" fill-opacity="0.35"/>
  </g>
</svg>
