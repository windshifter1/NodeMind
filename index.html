<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Noded — a local graph for thinking." />
    <meta name="application-name" content="Noded" />
    <meta name="theme-color" content="#efeff0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Noded" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Noded</title>
    <script>
      // Pre-paint: measure fixed inset:0 fill (avoids short 100vh/100svh bands).
      (function () {
        try {
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
            window.navigator.standalone === true;
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;top:0;right:0;bottom:0;left:0;visibility:hidden;pointer-events:none;';
          document.documentElement.appendChild(probe);
          var rect = probe.getBoundingClientRect();
          probe.remove();
          var height = Math.max(window.innerHeight || 0, Math.round(rect.height) || 0);
          var width = Math.max(window.innerWidth || 0, Math.round(rect.width) || 0);
          var vv = window.visualViewport;
          if (vv) {
            var visibleH = Math.round(vv.height + vv.offsetTop) || 0;
            var visibleW = Math.round(vv.width + vv.offsetLeft) || 0;
            if (visibleH >= 80) height = Math.min(height, visibleH);
            if (visibleW >= 80) width = Math.min(width, visibleW);
          }
          if (height >= 80) {
            document.documentElement.style.setProperty('--app-frame-height', Math.round(height) + 'px');
          }
          if (width >= 80) {
            document.documentElement.style.setProperty('--app-frame-width', Math.round(width) + 'px');
          }
        } catch (e) {}
        try {
          var theme = localStorage.getItem('thoughts-canvas-node-theme-v2');
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', dark);
        } catch (e2) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
