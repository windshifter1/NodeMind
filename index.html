<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="NodeMind — a local-first mind map canvas by Windshifter" />
    <meta name="application-name" content="NodeMind" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NodeMind" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>NodeMind</title>
    <script>
      // Pre-paint: measure fixed inset:0 fill (avoids short 100vh/100svh bands).
      (function () {
        try {
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
            window.navigator.standalone === true;
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;top:0;right:0;bottom:0;left:0;visibility:hidden;pointer-events:none;';
          document.documentElement.appendChild(probe);
          var rect = probe.getBoundingClientRect();
          probe.remove();
          var height = Math.max(window.innerHeight || 0, Math.round(rect.height) || 0);
          var width = Math.max(window.innerWidth || 0, Math.round(rect.width) || 0);
          if (standalone && window.screen) {
            var portrait =
              (window.matchMedia && window.matchMedia('(orientation: portrait)').matches) ||
              window.screen.height >= window.screen.width;
            var screenH = portrait
              ? Math.max(window.screen.width, window.screen.height)
              : Math.min(window.screen.width, window.screen.height);
            var screenW = portrait
              ? Math.min(window.screen.width, window.screen.height)
              : Math.max(window.screen.width, window.screen.height);
            height = Math.max(height, screenH || 0);
            width = Math.max(width, screenW || 0);
          }
          if (height >= 80) {
            document.documentElement.style.setProperty('--app-frame-height', Math.round(height) + 'px');
          }
          if (width >= 80) {
            document.documentElement.style.setProperty('--app-frame-width', Math.round(width) + 'px');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
